# Fast local hooks only. Pytest stays in CI (too slow for every commit).
# No ruff-format: it would churn large CustomTkinter UI modules.
exclude: >
  (?x)^(
      (\.mypy_cache|\.ruff_cache|\.pytest_cache|\.tox|\.nox)/.*
      |.*\.egg-info/.*
      |.*/__pycache__/.*
      |.*\.pyc
  )$

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.13
    hooks:
      # Lint only — no --fix / --unsafe-fixes, so UI files are not rewritten.
      - id: ruff-check
